<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stef's Achievements</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #ffffff; text-align: center; }
        .game-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 40px; justify-content: center; padding: 20px; }
        .game-container { cursor: pointer; text-align: center; }
        .game-thumbnail { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        .challenges { max-height: 0; overflow: hidden; transition: max-height 0.5s ease-out, padding 0.5s ease-out; padding: 0 10px; background-color: #333; border-radius: 10px; margin-top: 5px; }
        .challenges a { color: #00bfff; display: block; text-decoration: none; margin: 5px 0; transition: color 0.3s, text-decoration 0.3s; }
        .challenges a:hover { color: #ffcc00; text-decoration: underline; }
        
        /* Chapter Box Styling */
        .chapter-box { 
            background-color: #ffcc00; 
            color: #1e1e1e; 
            padding: 3px 8px; 
            border-radius: 10px; 
            display: inline-block; 
            font-weight: bold; 
            font-size: 0.8em; 
            margin-top: 5px;
        }

        /* Game Title Styling with Underline */
        .game-title {
            font-weight: bold;
            margin-bottom: 5px;
            text-decoration: underline; /* Underline the game titles */
            text-decoration-color: #ffffff; /* Underline color set to white */
            text-decoration-thickness: 2px; /* Optional: thickness of the underline */
        }

        /* Search Bar Styling */
        .search-bar {
            margin: 20px auto;
            padding: 10px;
            font-size: 1.2em;
            width: 80%;
            max-width: 600px;
            border-radius: 5px;
            border: 2px solid #ffffff;
            background-color: #333;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>Stef's Completed Achievements & Challenges</h1>
    <p class="legend">🏆 = Achievement  &nbsp;|&nbsp; 🥊 = Challenge  &nbsp;|&nbsp; 🏆🥊 = Both. The Achievement is either not related, or semi-related to the challenge in the video</p>

    <!-- Search Bar -->
    <input type="text" id="search" class="search-bar" onkeyup="filterGames()" placeholder="Search for a game...">

    <div class="game-grid">
        <div class="game-container" onclick="toggleChallenges('0304')">
            <div class="game-title">03.04</div>
            <img src="images/0304.jpg" alt="0304" class="game-thumbnail" loading="lazy">
            <div id="0304" class="challenges">
                <a href="https://youtu.be/HWCH_XJdc3E" target="_blank">🏆 Hardcore Difficulty</a>
                <a href="https://youtu.be/hlC6q1FGd4c" target="_blank">🏆 10,000+ Points in Survival Mode</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let openSections = JSON.parse(localStorage.getItem("openChallenges")) || {};
            Object.keys(openSections).forEach(id => {
                let element = document.getElementById(id);
                if (element) {
                    element.style.maxHeight = element.scrollHeight + "px";
                    element.style.padding = "10px";
                }
            });
        });

        function toggleChallenges(gameId) {
            var challenges = document.getElementById(gameId);
            let openSections = JSON.parse(localStorage.getItem("openChallenges")) || {};
            
            if (challenges.style.maxHeight && challenges.style.maxHeight !== "0px") {
                challenges.style.maxHeight = "0px";
                challenges.style.padding = "0 10px";
                delete openSections[gameId];
            } else {
                challenges.style.maxHeight = challenges.scrollHeight + "px";
                challenges.style.padding = "10px";
                openSections[gameId] = true;
            }
            localStorage.setItem("openChallenges", JSON.stringify(openSections));
        }

        function filterGames() {
            var input = document.getElementById('search');
            var filter = input.value.toLowerCase();
            var gameContainers = document.getElementsByClassName('game-container');

            for (var i = 0; i < gameContainers.length; i++) {
                var gameTitle = gameContainers[i].getElementsByClassName('game-title')[0];
                if (gameTitle) {
                    var titleText = gameTitle.textContent || gameTitle.innerText;
                    if (titleText.toLowerCase().indexOf(filter) > -1) {
                        gameContainers[i].style.display = "";
                    } else {
                        gameContainers[i].style.display = "none";
                    }
                }
            }
        }
    </script>
</body>
</html>
