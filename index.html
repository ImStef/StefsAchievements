<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Challenge Runs</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #ffffff; text-align: center; }
        .game-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; justify-content: center; padding: 20px; }
        .game-container { cursor: pointer; text-align: center; }
        .game-thumbnail { width: 100%; border-radius: 10px; }
        .challenges { display: none; padding: 10px; background-color: #333; border-radius: 10px; margin-top: 5px; }
        .challenges a { color: #00bfff; display: block; text-decoration: none; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>My Completed Achievements and Challenges</h1>
    
    <div class="game-grid">
        <div class="game-container" onclick="toggleChallenges('game1')">
            <img src="NGtest.jpg" alt="Game 1" class="game-thumbnail">
            <div id="game1" class="challenges">
                <a href="#">Challenge 1</a>
                <a href="#">Challenge 2</a>
            </div>
        </div>
        
        <div class="game-container" onclick="toggleChallenges('game2')">
            <img src="doomtest.jpg" alt="Game 2" class="game-thumbnail">
            <div id="game2" class="challenges">
                <a href="#">Challenge 1</a>
            </div>
        </div>
        
        <div class="game-container" onclick="toggleChallenges('game3')">
            <img src="game3-thumbnail.jpg" alt="Game 3" class="game-thumbnail">
            <div id="game3" class="challenges">
                <a href="#">Challenge 1</a>
            </div>
        </div>
        
        <div class="game-container" onclick="toggleChallenges('game4')">
            <img src="game4-thumbnail.jpg" alt="Game 4" class="game-thumbnail">
            <div id="game4" class="challenges">
                <a href="#">Challenge 1</a>
            </div>
        </div>
        
        <div class="game-container" onclick="toggleChallenges('game5')">
            <img src="game5-thumbnail.jpg" alt="Game 5" class="game-thumbnail">
            <div id="game5" class="challenges">
                <a href="#">Challenge 1</a>
            </div>
        </div>
    </div>
    
    <script>
        function toggleChallenges(gameId) {
            var challenges = document.getElementById(gameId);
            if (challenges.style.display === "block") {
                challenges.style.display = "none";
            } else {
                challenges.style.display = "block";
            }
        }
    </script>
</body>
</html>
